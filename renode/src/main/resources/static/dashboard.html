<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReNode | Company Dashboard</title>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px;
            background-color: #111827;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            padding: 24px 0;
        }

        .brand {
            padding: 0 24px;
            margin-bottom: 40px;
        }

        .brand h2 {
            font-size: 22px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: -0.5px;
        }

        .nav-menu {
            list-style: none;
            flex: 1;
        }

        .nav-item {
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-item:hover, .nav-item.active {
            background-color: rgba(255, 255, 255, 0.05);
            color: #f8fafc;
            border-right: 3px solid #3b82f6;
        }

        .nav-item i {
            font-size: 18px;
        }

        .logout-btn {
            margin: 0 24px;
            padding: 10px;
            background-color: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background-color: rgba(239, 68, 68, 0.2);
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header-row h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .btn-primary {
            background-color: #f8fafc;
            color: #0f172a;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background-color: #e2e8f0;
        }

        /* --- STATS CARDS --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background-color: #111827;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
        }

        .stat-title {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #f8fafc;
        }

        /* --- DATA TABLE --- */
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #e2e8f0;
        }

        .table-container {
            background-color: #111827;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: rgba(255, 255, 255, 0.03);
            padding: 14px 20px;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        td {
            padding: 16px 20px;
            font-size: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .badge.waste {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .badge.requirement {
            background-color: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
        }

        .empty-state {
            padding: 40px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="brand">
        <h2>ReNode</h2>
    </div>
    <ul class="nav-menu">
        <a href="dashboard.html" class="nav-item active">
            <i class="ph ph-squares-four"></i> Dashboard
        </a>
        <a href="index.html" class="nav-item">
            <i class="ph ph-map-trifold"></i> Marketplace Map
        </a>
    </ul>
    <div class="logout-btn" onclick="handleLogout()">
        <i class="ph ph-sign-out"></i> Sign Out
    </div>
</div>

<!-- Main Content -->
<div class="main-content">
    <div class="header-row">
        <h1>Welcome, <span id="companyNameDisplay">Company</span></h1>
        <button class="btn-primary" onclick="document.getElementById('resourceModal').style.display='flex'">
            <i class="ph ph-plus"></i> Add Resource
        </button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-title">Active Listings</div>
            <div class="stat-value" id="totalListings">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">Total Waste Listed</div>
            <div class="stat-value" id="totalWaste">0t</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">Platform Status</div>
            <div class="stat-value" style="color: #10b981; font-size: 16px; margin-top: 10px;">
                <i class="ph ph-check-circle"></i> Connected
            </div>
        </div>
    </div>

    <div class="section-title">Your Inventory & Requirements</div>
    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>Type</th>
                <th>Category</th>
                <th>Quantity (Tons)</th>
                <th>Description</th>
            </tr>
            </thead>
            <tbody id="resourceTableBody">
            <tr>
                <td colspan="4" class="empty-state">Loading your resources...</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // 1. Auth Guard - Check if user is logged in
    const companyId = localStorage.getItem('companyId');
    const companyName = localStorage.getItem('companyName');

    if (!companyId) {
        window.location.href = 'login.html';
    }

    document.getElementById('companyNameDisplay').innerText = companyName;

    // 2. Fetch specific company resources
    async function fetchMyResources() {
        try {
            const response = await fetch(`http://localhost:8080/api/companies/${companyId}/resources`);
            const resources = await response.json();

            const tbody = document.getElementById('resourceTableBody');
            document.getElementById('totalListings').innerText = resources.length;

            let wasteCount = 0;
            tbody.innerHTML = '';

            if (resources.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="empty-state">No resources listed yet. Click 'Add Resource' to start.</td></tr>`;
                return;
            }

            resources.forEach(res => {
                if (res.listingType === 'WASTE') {
                    wasteCount += res.quantityInTons;
                }

                const badgeClass = res.listingType === 'WASTE' ? 'waste' : 'requirement';

                const row = `
                        <tr>
                            <td><span class="badge ${badgeClass}">${res.listingType}</span></td>
                            <td>${res.category}</td>
                            <td>${res.quantityInTons} t</td>
                            <td>${res.description || '-'}</td>
                        </tr>
                    `;
                tbody.innerHTML += row;
            });

            document.getElementById('totalWaste').innerText = wasteCount + 't';

        } catch (error) {
            console.error("Error fetching resources:", error);
            document.getElementById('resourceTableBody').innerHTML = `<tr><td colspan="4" class="empty-state" style="color: #ef4444;">Failed to load data. Ensure backend is running.</td></tr>`;
        }
    }

    // 3. Logout Logic
    function handleLogout() {
        localStorage.removeItem('companyId');
        localStorage.removeItem('companyName');
        window.location.href = 'login.html';
    }

    // Initialize dashboard data
    fetchMyResources();
    // 4. Add Resource Form Logic
    document.getElementById('addResourceForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const newResource = {
            listingType: document.getElementById('listingType').value,
            category: document.getElementById('category').value,
            quantityInTons: document.getElementById('quantity').value,
            description: document.getElementById('description').value
        };

        try {
            const response = await fetch(`http://localhost:8080/api/companies/${companyId}/resources`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newResource)
            });

            if (response.ok) {
                document.getElementById('resourceModal').style.display = 'none';
                document.getElementById('addResourceForm').reset();

                // Naya data load karne ke liye table refresh karo
                fetchMyResources();

                alert("Resource added successfully!"); // Isko chaho toh toast se replace kar sakte ho baad me
            } else {
                alert("Failed to add resource.");
            }
        } catch (error) {
            console.error("Error saving resource:", error);
        }
    });
</script>
<!-- Add Resource Modal -->
<div id="resourceModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 3000; justify-content: center; align-items: center; backdrop-filter: blur(5px);">
    <div style="background: #111827; padding: 30px; border-radius: 12px; width: 400px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 10px 30px rgba(0,0,0,0.8);">
        <h3 style="color: #f8fafc; margin-top: 0; margin-bottom: 20px; font-size: 20px;">Add New Resource</h3>

        <form id="addResourceForm" style="display: flex; flex-direction: column; gap: 15px;">
            <div>
                <label style="font-size: 13px; color: #94a3b8; display: block; margin-bottom: 5px;">Type</label>
                <select id="listingType" required style="width: 100%; background: #0f172a; color: white; padding: 10px; border: 1px solid #334155; border-radius: 6px; outline: none;">
                    <option value="WASTE">Selling Waste</option>
                    <option value="REQUIREMENT">Buying Raw Material</option>
                </select>
            </div>
            <div>
                <label style="font-size: 13px; color: #94a3b8; display: block; margin-bottom: 5px;">Category (e.g. Plastic, Metal)</label>
                <input type="text" id="category" required style="width: 100%; background: #0f172a; color: white; padding: 10px; border: 1px solid #334155; border-radius: 6px; outline: none;">
            </div>
            <div>
                <label style="font-size: 13px; color: #94a3b8; display: block; margin-bottom: 5px;">Quantity (in Tons)</label>
                <input type="number" id="quantity" required style="width: 100%; background: #0f172a; color: white; padding: 10px; border: 1px solid #334155; border-radius: 6px; outline: none;">
            </div>
            <div>
                <label style="font-size: 13px; color: #94a3b8; display: block; margin-bottom: 5px;">Description (Optional)</label>
                <input type="text" id="description" style="width: 100%; background: #0f172a; color: white; padding: 10px; border: 1px solid #334155; border-radius: 6px; outline: none;">
            </div>

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button type="submit" style="flex: 1; background: #f8fafc; color: #0f172a; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">Save Resource</button>
                <button type="button" onclick="document.getElementById('resourceModal').style.display='none'" style="flex: 1; background: transparent; color: #94a3b8; border: 1px solid #334155; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600;">Cancel</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
