<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReNode | B2B Matchmaker</title>
    <link rel="icon" type="image/webp" href="images/renode.webp">

    <!-- Favicon and Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Inter:wght@500&display=swap" rel="stylesheet">

    <!-- Phosphor Icons for Hamburger & Navigation -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        #activeCompanyName {
            background: transparent !important; box-shadow: none !important; border: none !important;
            padding: 0 !important; border-radius: 0 !important; color: #38bdf8 !important;
            font-size: 18px !important; font-weight: 800 !important;
        }

        /* Glassmorphism and UI Enhancements */
        #sidebar {
            background: rgba(17, 24, 39, 0.85) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .top-analytics-bar {
            background: rgba(15, 23, 42, 0.65) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }

        /* Mobile Responsiveness for Map Page */
        .map-hamburger {
            display: none; position: absolute; top: 15px; left: 15px; z-index: 9999;
            background: #111827; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
            color: #f8fafc; cursor: pointer; font-size: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            #sidebar {
                position: fixed; left: -340px; top: 0; bottom: 0; width: 300px;
                z-index: 10000; transition: left 0.3s ease; box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            }
            #sidebar.open { left: 0; }
            .map-hamburger { display: block; }

            /* Adjust Top Analytics for Mobile */
            .top-analytics-bar {
                flex-direction: column !important; gap: 10px !important; padding: 15px 20px !important;
                top: 70px !important; right: 15px !important; left: auto !important; transform: none !important;
                border-radius: 12px !important; width: auto !important; align-items: flex-end !important;
            }
            .top-analytics-bar .divider { display: none; }
            .top-analytics-bar > div { text-align: right !important; }
        }
    </style>
</head>
<body>

<!-- Hamburger Icon for Mobile Map View -->
<div class="map-hamburger" onclick="document.getElementById('sidebar').classList.toggle('open')">
    <i class="ph ph-list"></i>
</div>

<div id="sidebar">

    <!-- Brand Lockup -->
    <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 25px; padding: 0;">
        <img src="images/renode.webp" alt="ReNode Icon" style="height: 56px; width: 56px; object-fit: contain; border-radius: 14px; box-shadow: 0 4px 15px rgba(0, 210, 255, 0.2);">
        <div style="display: flex; flex-direction: column; justify-content: center;">
            <div style="font-family: 'Montserrat', sans-serif; font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 40%, #10b981 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; letter-spacing: -1px;">
                ReNode
            </div>
            <div style="font-family: 'Inter', sans-serif; font-size: 8px; font-weight: 600; color: #94a3b8; letter-spacing: 1.2px; text-transform: uppercase; margin-top: 4px;">
                Connect Supply. Unlock Growth.
            </div>
        </div>
    </div>

    <!-- Back to Dashboard Button (Hidden by default, shown if logged in) -->
    <a href="dashboard.html" id="backToDashBtn" style="display: none; text-decoration: none; color: #38bdf8; font-size: 14px; font-weight: 600; margin-bottom: 25px; align-items: center; gap: 8px; background: rgba(56, 189, 248, 0.1); padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(56, 189, 248, 0.2); transition: all 0.2s ease; width: fit-content;">
        <i class="ph ph-arrow-left" style="font-size: 16px;"></i> Back to Dashboard
    </a>

    <!-- AUTH SECTION -->
    <div style="background: rgba(30, 41, 59, 0.4); padding: 20px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
        <!-- CURRENT SESSION BADGE -->
        <div id="userProfileBadge" style="background: rgba(15, 23, 42, 0.7); padding: 16px; border-radius: 16px; border: 1px solid rgba(56, 189, 248, 0.3); margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(8px);">
            <div style="display: flex; flex-direction: column; gap: 4px;">
                <span style="font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Current Session</span>
                <span id="activeCompanyName">Guest Mode</span>
            </div>
            <div id="statusDot" style="width: 10px; height: 10px; background: #64748b; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5);"></div>
        </div>

        <button id="loginBtn" onclick="window.location.href='login.html'" style="width: 100%; background: #f8fafc; color: #0f172a; border: none; padding: 12px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; margin-bottom: 12px; transition: 0.2s;">
            🔐 Login to Dashboard
        </button>

        <button id="registerBtn" onclick="window.location.href='register.html'" style="width: 100%; background: transparent; color: #38bdf8; border: 1px dashed #38bdf8; padding: 12px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer;">
            📍 Register New Factory
        </button>
    </div>

    <!-- MAP CONTROLS -->
    <div class="control-group">
        <label>Search Radius: <span id="radius-value" style="color: #38bdf8;">50</span> km</label>
        <input type="range" id="radius-slider" min="5" max="250" value="50" step="5">
    </div>

    <h3 style="font-size: 14px; color: #94a3b8; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 1px;">Nearby Network</h3>
    <div id="results">
        <!-- Results will load here -->
    </div>
</div>

<!-- Top Analytics Bar -->
<div class="top-analytics-bar" style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); padding: 15px 40px; border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.1); display: flex; gap: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); color: white; font-family: sans-serif;">
    <div style="text-align: center;">
        <div style="font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Network Hubs</div>
        <div id="stat-factories" style="font-size: 22px; font-weight: bold; color: #38bdf8;">0</div>
    </div>
    <div class="divider" style="width: 1px; background: rgba(255,255,255,0.2);"></div>
    <div style="text-align: center;">
        <div style="font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Active Listings</div>
        <div id="stat-resources" style="font-size: 22px; font-weight: bold; color: #a855f7;">0</div>
    </div>
    <div class="divider" style="width: 1px; background: rgba(255,255,255,0.2);"></div>
    <div style="text-align: center;">
        <div style="font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Waste Available</div>
        <div id="stat-waste" style="font-size: 22px; font-weight: bold; color: #10b981;">0t</div>
    </div>
</div>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Custom JS -->
<script src="js/app.js"></script>

<!-- Authentication & UI Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Agar user logged in hai (JWT token hai)
        if (localStorage.getItem('jwt_token') && localStorage.getItem('companyName')) {

            // 1. Show Back to Dashboard Button
            document.getElementById('backToDashBtn').style.display = 'flex';

            // 2. Update Current Session Badge
            document.getElementById('activeCompanyName').innerText = localStorage.getItem('companyName');
            const statusDot = document.getElementById('statusDot');
            statusDot.style.background = '#10b981'; // Green color for active
            statusDot.style.boxShadow = '0 0 10px rgba(16, 185, 129, 0.5)';

            // 3. Change Login button text to "Open Dashboard"
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.innerHTML = '<i class="ph ph-squares-four"></i> Open Dashboard';
            loginBtn.style.background = '#38bdf8';
            loginBtn.style.color = '#0f172a';
            loginBtn.onclick = function() { window.location.href = 'dashboard.html'; };

            // 4. Hide Register button
            document.getElementById('registerBtn').style.display = 'none';
        }
    });
</script>
</body>
</html>
